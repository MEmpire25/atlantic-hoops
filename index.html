<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Atlantic Hoops | Player stats</title>
<link rel="icon" href="data:,">   <!-- no logo, so an empty icon keeps the browser asking for /favicon.ico -->
<link rel="preload" href="fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/tokens.css?v=5f3ae5be70">
<link rel="stylesheet" href="css/site.css?v=5f3ae5be70">
<script src="js/theme.js?v=5f3ae5be70"></script>
</head>
<body class="filters-closed">
<header class="top">
  <div class="deco" aria-hidden="true">
    <svg viewBox="0 0 400 100" preserveAspectRatio="xMidYMid meet" focusable="false">
      <path d="M20 100 V62 A180 180 0 0 1 380 62 V100"/>
      <rect x="140" y="40" width="120" height="60"/>
      <path d="M158 40 A42 42 0 0 1 242 40"/>
      <path d="M158 40 A42 42 0 0 0 242 40" stroke-dasharray="4 4"/>
      <line x1="0" y1="98" x2="400" y2="98"/>
    </svg>
  </div>
  <a class="wordmark" href="index.html" aria-label="Atlantic Hoops home">Atlantic <b>Hoops</b></a>
  <nav aria-label="Site">
    <a href="index.html" aria-current="page">Stats</a>
    <a href="glossary.html">Glossary</a>
    <a href="https://substack.com/@atlantichoops/posts" target="_blank" rel="noopener">Substack &#8599;</a>
    <button id="theme" class="btn" type="button">Light theme</button>
  </nav>
</header>

<div class="tabbar">
  <div id="tabs" role="tablist" aria-label="Stat categories"></div>
  <label class="tabsel"><span>Category</span><select id="tab-select" aria-label="Stat category"></select></label>
  <button type="button" class="filters-btn" id="filters-btn" aria-expanded="false" aria-controls="toolbar">Filters</button>
</div>

<section class="toolbar" id="toolbar" aria-label="Season and filters">
  <div class="fld"><div class="lbl-row"><span id="label-type">Season type</span>
      <button type="button" role="switch" id="multi-switch" class="mini-switch" aria-checked="false" aria-label="Multi seasons" data-tip="Multi: combine several seasons into one table of averages." data-tip-href="glossary.html#multi-mode"><span aria-hidden="true">Multi</span><span class="ms-track" aria-hidden="true"><span class="ms-knob"></span></span></button>
    </div>
    <div class="seg" role="group" aria-labelledby="label-type">
      <button type="button" id="type-rs" data-type="rs" aria-pressed="true">Regular Season</button>
      <button type="button" id="type-po" data-type="po" aria-pressed="false">Playoffs</button>
    </div></div>
  <div class="fld"><span id="label-season">Season</span>
    <select id="season" aria-labelledby="label-season"></select>
    <div class="season-wrap" hidden id="season-multi">
      <button type="button" class="selbtn" id="season-btn" aria-haspopup="dialog" aria-expanded="false" aria-controls="season-pop" aria-labelledby="label-season season-btn"></button>
      <div id="season-pop" role="group" aria-label="Seasons" hidden>
        <div class="sp-head"><b>Seasons</b><span id="sp-count"></span></div>
        <div id="sp-list"></div>
        <div class="sp-foot">
          <button type="button" class="link-btn" id="season-cancel">Cancel</button>
          <button type="button" class="btn primary" id="season-apply">Apply</button>
        </div>
      </div>
    </div></div>
  <label class="fld filter-field" data-filter="search"><span>Player</span><input id="f-q" type="search" placeholder="Search name" autocomplete="off"></label>
  <label class="fld filter-field" data-filter="pos"><span>Pos</span><select id="f-pos"></select></label>
  <label class="fld filter-field" data-filter="team" data-single-only><span>Team</span><select id="f-team"></select></label>
  <label class="fld filter-field" data-filter="minSeasons" data-multi-only hidden><span>Min seasons</span><select id="f-min-seasons"></select></label>
  <label class="fld filter-field" data-filter="minMp"><span id="mp-label">Min MP</span><input id="f-mp" type="number" inputmode="numeric" step="1"></label>
  <label class="fld filter-field" data-filter="minGp"><span>Min GP</span><input id="f-gp" type="number" inputmode="numeric" step="1" min="0"></label>
  <div class="fld filter-field" data-filter="age" data-single-only role="group" aria-label="Age range"><span>Age</span>
    <span class="pair"><input id="f-age-min" type="number" inputmode="numeric" min="0" aria-label="Minimum age"><span aria-hidden="true">&ndash;</span><input id="f-age-max" type="number" inputmode="numeric" min="0" aria-label="Maximum age"></span></div>
  <button type="button" class="btn filter-field" data-reset>Reset</button>
  <div class="right-tools">
    <div class="seg" role="group" aria-label="Show rank or percentile beside values">
      <button type="button" id="mode-rank" data-rank-mode="rank" aria-pressed="true">Rank</button>
      <button type="button" id="mode-percentile" data-rank-mode="percentile" aria-pressed="false">Percentile</button>
    </div>
    <button type="button" class="btn" id="compare-btn" disabled title="Tick at least 2 players to compare">Compare (0)</button>
    <div class="picker-wrap">
      <button type="button" class="btn" id="picker-btn" aria-expanded="false" aria-controls="picker">Columns</button>
      <div id="picker" role="group" aria-label="Choose columns for this tab" hidden>
        <div class="pk-actions">
          <button type="button" data-pick-action="default">Default</button>
          <button type="button" data-pick-action="all">All</button>
          <button type="button" data-pick-action="none">None</button>
        </div>
        <div id="picker-body"></div>
      </div>
    </div>
  </div>
</section>

<div id="chips" class="chips" aria-label="Active filters"></div>
<div id="flash" class="notice flash" role="status" hidden></div>
<div id="notice" class="notice" role="status" hidden></div>
<div id="selection-note" class="notice" role="status" hidden></div>
<p id="multi-note" class="multi-note" hidden></p>
<div class="meta">
  <span id="count" aria-live="polite"></span>
  <span class="legend" id="legend"></span>
</div>

<div id="panel" role="tabpanel">
  <div id="loading-bar" class="progress" hidden></div>
  <div id="table-wrap" class="table-wrap" tabindex="0" aria-label="Player stats table (scrolls sideways)"><table id="grid"></table></div>
  <div id="overlay" class="overlay" role="status" hidden></div>
  <div id="state-panel" hidden></div>
</div>

<footer>
  <div id="credits" hidden></div>
</footer>
<div id="backdrop" hidden></div>
<div id="tip" role="region" aria-label="Column help" hidden></div>
<div id="hint" role="status" hidden></div>

<script type="module" src="js/main.js?v=5f3ae5be70"></script>
</body>
</html>
